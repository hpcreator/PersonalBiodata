<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harsh Patel</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Google Fonts -->
    <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Mono:wght@700&display=swap"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link href="docs/harsh_style.css" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/hp_favicon.png">

</head>

<body>

<!-- Header -->
<div class="header">
    <img src="./assets/ganesh.png" alt="Header Image">
</div>

<!-- Biodata Card -->
<div class="card-container">

    <div class="card" id="flipCard">

        <!-- Front Side -->
        <div class="card-front">

            <h5 class="font-weight-bold">Biodata</h5>

            <img
                    class="pop-img"
                    src="./assets/harsh1.jpg"
                    alt="Profile Picture">

            <div class="details">
                <h4 class="font-weight-bold">Harsh Patel</h4>
                <h5>Software Engineer</h5>
            </div>

        </div>

        <!-- Back Side -->
        <div class="card-back">

            <h5 class="text-center font-weight-bold w-100 mb-3">
                My Details
            </h5>

            <div class="overflow-auto d-none" id="back-card">

                <!-- Personal Details -->
                <dl class="detail-list" id="detail-list"></dl>

                <hr class="mt-5">

                <!-- Image Gallery -->
                <h5 class="m-0 font-weight-bold w-100 text-center">
                    Images
                </h5>

                <div id="all-images"></div>

            </div>

        </div>

    </div>

</div>

<!-- Flip Card Hint -->
<div class="hint-footer cursor-pointer text-center" id="clickToFlap">

    <h5 class="m-0 pb-3 font-weight-bold buttonFlipCard">
        Click to flip
    </h5>

</div>


<!-- Image Preview Modal -->
<div
        class="modal fade"
        id="imagemodal"
        tabindex="-1"
        role="dialog"
        aria-hidden="true">

    <div
            class="modal-dialog modal-dialog-centered image-modal-dialog"
            role="document">

        <div class="modal-content image-modal-content">

            <!-- Close Button -->
            <button
                    type="button"
                    class="close image-modal-close"
                    data-dismiss="modal"
                    aria-label="Close">

                <span aria-hidden="true">&times;</span>

            </button>

            <!-- Image Preview -->
            <div class="modal-body image-modal-body">

                <img
                        src=""
                        class="imagepreview"
                        alt="Image Preview">

            </div>

        </div>

    </div>

</div>


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<!-- Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Custom JavaScript -->
<script type="text/javascript" src="docs/harsh_main.js"></script>

</body>

</html>
